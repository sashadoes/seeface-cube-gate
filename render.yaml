# One-click hosting for the seeface1 API (accounts + saved progress) on Render.
# Render → New → Blueprint → pick this repo. Then fill MONGODB_URI (from MongoDB Atlas).
services:
  - type: web
    name: seeface1-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: seeface1
      - key: ALLOWED_ORIGINS
        value: https://seeface.world,https://seeface1.world
      - key: IP_SALT
        generateValue: true
      - key: SITE_URL
        value: https://seeface.world
      # Instagram login (optional): fill these in Render after creating the Meta app
      - key: IG_APP_ID
        sync: false
      - key: IG_APP_SECRET
        sync: false
      - key: IG_REDIRECT
        sync: false
      # the labyrinth's characters (◇) talk through Claude when this is set; without it they use scripted lines
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NPC_DAILY_CAP
        value: "3000" # Claude calls per day for all players together
      - key: ADMIN_KEY
        generateValue: true # copy it from Render → Environment to read /api/stats
      # The Architects (/architects → /chamber → /admin/architects). ADMIN_KEY above also opens the review desk.
      - key: CHAMBER_DAILY_LIMIT
        value: "150" # SeeFace messages per Architect per day
      - key: CHAMBER_DAILY_CAP
        value: "5000" # SeeFace calls per day for everyone together
      # email (sign-in links, "your door is open"): a Resend key + a sender on a verified domain; without them emails are only logged
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # voice → text (the labyrinth's 🎙 chat + the Chamber) for browsers without their own speech recognition
      # (e.g. Instagram's in-app browser on iPhone). ElevenLabs is preferred; audio is never stored.
      - key: ELEVENLABS_API_KEY
        sync: false
      # or any OpenAI-compatible /audio/transcriptions endpoint
      - key: TRANSCRIBE_API_KEY
        sync: false
