# One-click hosting for the seeface1 API (accounts + saved progress) on Render.
# Render → New → Blueprint → pick this repo. Then fill MONGODB_URI (from MongoDB Atlas).
services:
  - type: web
    name: seeface1-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: seeface1
      - key: ALLOWED_ORIGINS
        value: https://seeface1.world
      - key: IP_SALT
        generateValue: true
      - key: SITE_URL
        value: https://seeface1.world
      # Instagram login (optional): fill these in Render after creating the Meta app
      - key: IG_APP_ID
        sync: false
      - key: IG_APP_SECRET
        sync: false
      - key: IG_REDIRECT
        sync: false
      - key: ADMIN_KEY
        generateValue: true # copy it from Render → Environment to read /api/stats
      # control room (seeface1.world/control), optional: list/start GitHub Actions, restart/redeploy on Render
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
